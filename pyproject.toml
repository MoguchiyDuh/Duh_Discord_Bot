[project]
name = "duh-discord-bot"
version = "2.0.0"
description = "Multipurpose Discord bot: YouTube music, minigames, temporary voice channels, weather."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12",
    "bgutil-ytdlp-pot-provider>=1.3",
    "cairosvg>=2.8",
    "chess>=1.11",
    "discord-py[voice]>=2.7",
    "lyricsgenius>=3.7",
    "python-dotenv>=1.1",
    "yt-dlp>=2026.8.19",
]
